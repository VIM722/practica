<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Servicios y tarifas')}"></head><body><aside th:replace="~{fragmentos :: navegacion}"></aside><div class="workspace-main"><header th:replace="~{fragmentos :: barra('Servicios y tarifas')}"></header><main class="page" id="contenido"><div class="page-heading"><div><span class="eyebrow">NUESTRO CATÁLOGO</span><h1>El cuidado que tu equipo necesita.</h1><p>Elige un servicio y conoce su tarifa antes de cotizar.</p></div></div><div class="catalog-grid"><article class="catalog-card" th:each="servicio : ${servicios}"><span class="service-icon"><svg th:replace="~{fragmentos :: icono(${servicio.icono})}"></svg></span><h2 th:text="${servicio.nombre}"></h2><p th:text="${servicio.descripcion}"></p><div class="catalog-price"><strong th:text="${'S/ ' + servicio.precio}"></strong><span>por unidad</span></div><a class="button secondary" th:href="@{/cotizaciones/nueva}">Cotizar servicio <svg th:replace="~{fragmentos :: icono('arrow')}"></svg></a></article></div><section class="discount-catalog"><h2>Un beneficio para cada cliente</h2><p>El descuento se aplica sobre el subtotal de tu cotización.</p><div class="catalog-grid"><div th:each="tipo : ${tiposCliente}"><strong th:text="${porcentajes[tipo.name()] + '%'}"></strong><h3 th:text="${tipo.nombre}"></h3><p th:text="${tipo.descripcion}"></p></div></div></section><footer th:replace="~{fragmentos :: pie}"></footer></main></div></body></html>
